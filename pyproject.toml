[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testgen-cli"
version = "0.1.0"
description = "Automated test generator — scans Python source files and generates pytest stubs with sensible defaults"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "DevForge"}]
keywords = ["testing", "test-generator", "pytest", "automation", "qa", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click>=8.1.0",
  "rich>=15.0.0",
  "astroid>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Coding-Dev-Tools/testgen"
Repository = "https://github.com/Coding-Dev-Tools/testgen"

[project.scripts]
testgen = "testgen.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["testgen"]
